# render.yaml Infrastructure as Code for Render.com
services:
  - type: web
    name: trueline-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore # Render's closest region to India
    envVars:
      - key: PORT
        value: "8080"
      - key: ENV
        value: "production"
      - key: OTP_MOCK_MODE
        value: "false"
      - key: OTP_PROVIDER
        value: "mock"
      - key: MSG91_SERVER_AUTH_KEY
        sync: false # Server-side MSG91 access-token verification key; never place in an app
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard -> Environment
      - key: JWT_SECRET
        sync: false # Set in Render Dashboard -> Environment
      - key: ZEGO_APP_ID
        value: "1939552281"
      - key: ZEGO_SERVER_SECRET
        sync: false # Server-only 32-byte ZegoCloud secret; never place in an app
    healthCheckPath: /healthz
