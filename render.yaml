# render.yaml Infrastructure as Code for Render.com
services:
  - type: web
    name: trueline-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore # Render's closest region to India
    envVars:
      - key: PORT
        value: "8080"
      - key: ENV
        value: "production"
      - key: OTP_MOCK_MODE
        value: "false"
      - key: OTP_PROVIDER
        value: "mock"
      - key: MSG91_SERVER_AUTH_KEY
        sync: false # Server-side MSG91 access-token verification key; never place in an app
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard -> Environment
      - key: JWT_SECRET
        sync: false # Set in Render Dashboard -> Environment
      - key: ZEGO_APP_ID
        value: "1939552281"
      - key: ZEGO_SERVER_SECRET
        sync: false # Server-only 32-byte ZegoCloud secret; never place in an app
      - key: APNS_TEAM_ID
        sync: false # Apple Developer Team ID for listener VoIP notifications
      - key: APNS_KEY_ID
        sync: false # Apple APNs .p8 key ID
      - key: APNS_BUNDLE_ID
        sync: false # Listener iOS bundle ID, without the .voip suffix
      - key: APNS_PRIVATE_KEY
        sync: false # APNs .p8 PEM; use literal \n for new lines
      - key: APNS_SANDBOX
        value: "true"
    healthCheckPath: /healthz
